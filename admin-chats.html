  <div class="chat-input-row">

<script src="admin-config.js"></script>
<script>
  let usersMap = {};
  let chatThreads = [];
  let activeUid = null;
  let activeMsgRef = null;

  requireAdminAuth((user) => {
    document.getElementById("sideMenuEmail").textContent = user.email || "";
    markActiveNav();
    initScrollHideNav();
    watchPendingBadges();
    loadChatList();
  });

  function loadChatList() {
    document.getElementById("chatList").innerHTML = '<div class="loader-wrap"><div class="spin"></div> লোড হচ্ছে...</div>';
    Promise.all([db.ref("users").once("value"), db.ref("chats").once("value")])
      .then(([usersSnap, chatsSnap]) => {
        usersMap = {};
        usersSnap.forEach((c) => { usersMap[c.key] = c.val() || {}; });

        const chatByUid = {};
        chatsSnap.forEach((child) => {
          const messages = child.val() && child.val().messages ? child.val().messages : {};
          const msgArr = Object.values(messages);
          msgArr.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          const last = msgArr[msgArr.length - 1];
          chatByUid[child.key] = { lastMsg: last, lastTime: last ? last.createdAt : 0 };
        });

        // সকল ইউজারের লিস্ট দেখানো হচ্ছে — যাদের মেসেজ আছে তারা সবার উপরে (মেসেঞ্জারের মতো),
        // যাদের কোনো মেসেজ নেই তারা নিচে, নাম অনুযায়ী সাজানো
        chatThreads = Object.keys(usersMap).map((uid) => {
          const c = chatByUid[uid] || { lastMsg: null, lastTime: 0 };
          return { uid, lastMsg: c.lastMsg, lastTime: c.lastTime };
        });
        chatThreads.sort((a, b) => {
          if (b.lastTime !== a.lastTime) return b.lastTime - a.lastTime;
          const nameA = (usersMap[a.uid] && (usersMap[a.uid].name || usersMap[a.uid].firstName)) || "";
          const nameB = (usersMap[b.uid] && (usersMap[b.uid].name || usersMap[b.uid].firstName)) || "";
          return nameA.localeCompare(nameB, "bn");
        });
        renderChatList();
      }).catch(() => {
        document.getElementById("chatList").innerHTML = '<div class="empty-state">চ্যাট লোড করা যায়নি</div>';
      });
  }

  function renderChatList() {
    const wrap = document.getElementById("chatList");
    const q = (document.getElementById("chatSearchBox").value || "").trim().toLowerCase();
    let list = chatThreads;
    if (q) {
      list = chatThreads.filter((t) => {
        const u = usersMap[t.uid] || {};
        const name = (u.name || u.firstName || "").toLowerCase();
        const mobile = (u.mobile || "").toLowerCase();
        return name.includes(q) || mobile.includes(q);
      });
    }
    if (list.length === 0) { wrap.innerHTML = '<div class="empty-state">কোনো ইউজার পাওয়া যায়নি</div>'; return; }
    wrap.innerHTML = "";
    list.forEach((t) => {
      const u = usersMap[t.uid] || {};
      const name = u.name || u.firstName || (u.customUid || t.uid.slice(0, 8));
      const div = document.createElement("div");
      div.className = "chat-list-item";
      div.style.cursor = "pointer";
      div.onclick = () => openChat(t.uid, name);
      div.innerHTML = `
        <div class="avatar-row">
          ${avatarHtml(u.photoUrl, 'sm')}
          <div>
            <div class="nm">${escapeHtml(name)}</div>
            <div class="lm">${t.lastMsg ? (t.lastMsg.sender === 'admin' ? 'আপনিঃ ' : '') + escapeHtml(t.lastMsg.text || '') : 'কোনো মেসেজ নেই'}</div>
          </div>
        </div>
        <i class="fa-solid fa-chevron-right" style="color:var(--muted);font-size:12px;"></i>
      `;
      wrap.appendChild(div);
    });
  }

  function openChat(uid, name) {
    activeUid = uid;
    document.getElementById("chatActiveName").textContent = name;
    document.getElementById("chatThreadView").classList.add("open");

    if (activeMsgRef) activeMsgRef.off();
    activeMsgRef = db.ref("chats/" + uid + "/messages").orderByChild("createdAt");
    activeMsgRef.on("value", (snap) => {
      const box = document.getElementById("chatMessages");
      box.innerHTML = "";
      snap.forEach((child) => {
        const m = child.val() || {};
        const div = document.createElement("div");
        div.className = "chat-msg " + (m.sender === "admin" ? "admin" : "user");
        const time = m.createdAt ? new Date(m.createdAt).toLocaleTimeString("bn-BD", { hour: "2-digit", minute: "2-digit" }) : "";
        const textSpan = document.createElement("span");
        textSpan.textContent = m.text; // XSS আটকাতে textContent ব্যবহার করা হচ্ছে
        div.appendChild(textSpan);
        const timeSpan = document.createElement("span");
        timeSpan.className = "tm";
        timeSpan.textContent = time;
        div.appendChild(timeSpan);
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }, () => {
      document.getElementById("chatMessages").innerHTML = '<div class="empty-state">মেসেজ লোড করা যায়নি</div>';
    });
  }

  function closeChatThread() {
    document.getElementById("chatThreadView").classList.remove("open");
    if (activeMsgRef) { activeMsgRef.off(); activeMsgRef = null; }
    activeUid = null;
    loadChatList(); // লিস্টের সর্বশেষ মেসেজ প্রিভিউ রিফ্রেশ করা
  }

  function sendReply() {
    const input = document.getElementById("chatReplyInput");
    const text = input.value.trim();
    if (!text || !activeUid) return;
    input.disabled = true;
    db.ref("chats/" + activeUid + "/messages").push({
      text, sender: "admin", createdAt: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      input.value = "";
    }).catch(() => {
      showToast("মেসেজ পাঠানো যায়নি, আবার চেষ্টা করুন", "error");
    }).finally(() => {
      input.disabled = false;
      input.focus();
    });
  }
</script>
</body>
